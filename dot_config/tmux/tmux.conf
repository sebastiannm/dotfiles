# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -s set-clipboard on
setw -g aggressive-resize off

# Preserve lots of output.
set -g history-limit 100000

# Window navigation
bind -N "Create window" c new-window -c "#{pane_current_path}"

# Vi mode for copy
setw -g mode-keys vi

# Modern terminal support and true colour.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Claude Code inside tmux.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Reload config: Ctrl-b, then r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Toolbar
set -g status-position top
set -g status-interval 10
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'
set -g set-titles on
set -g set-titles-string '#S:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=white]#h "
set -g window-status-format "#[fg=white] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
